<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Ad & Earn Coins</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #1e1e1e; padding: 25px; border-radius: 16px; max-width: 360px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
    button { background: #00c853; color: white; border: none; padding: 14px 24px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 15px; }
    button:disabled { background: #555; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎬 Watch Video Ad</h2>
    <p>15 second ka video ad dekhein aur turant coins paayein!</p>
    <button id="adBtn" onclick="startAd()">▶️ Watch Ad Now</button>
    <p id="status" style="margin-top:15px; font-size:14px; color:#aaa;"></p>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "59338" }) : null;

    function startAd() {
      const btn = document.getElementById("adBtn");
      const status = document.getElementById("status");

      if (!AdController) {
        status.innerText = "Ad SDK load nahi hua, page refresh karein.";
        return;
      }

      btn.disabled = true;
      status.innerText = "Ad load ho raha hai...";

      AdController.show().then((result) => {
        status.style.color = "#00c853";
        status.innerText = "✅ Ad poora hua! Coins add ho rahe hain...";
        btn.disabled = false;
        
        if (tg && tg.sendData) {
          tg.sendData(JSON.stringify({ status: "completed", blockId: "59338" }));
        }
      }).catch((error) => {
        status.style.color = "#ff5252";
        status.innerText = "❌ Ad abhi uplabdh nahi hai ya skip kiya gaya.";
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
